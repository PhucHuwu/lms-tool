<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LMS Video Status</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="card">
      <h1>Video LMS</h1>
      <p id="status" class="status">Dang kiem tra...</p>
      <p id="study-status" class="study-status">Bam Bat dau hoc de chay kich ban kiem thu.</p>
      <dl class="details">
        <div>
          <dt>Thoi gian</dt>
          <dd id="time">--</dd>
        </div>
        <div>
          <dt>Tien do</dt>
          <dd id="progress">--</dd>
        </div>
        <div>
          <dt>Toc do</dt>
          <dd id="speed">--</dd>
        </div>
        <div>
          <dt>Am luong</dt>
          <dd id="volume">--</dd>
        </div>
      </dl>
      <button id="start" type="button">Bat dau hoc</button>
      <button id="stop" type="button" class="secondary">Dung</button>
      <button id="refresh" type="button">Kiem tra lai</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
