<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LMS Video Status</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="card">
      <h1>Video LMS</h1>
      <p id="status" class="status">Đang kiểm tra...</p>
      <p id="study-status" class="study-status">Bấm Bắt đầu học để chạy kịch bản kiểm thử.</p>
      <dl class="details">
        <div>
          <dt>Thời gian</dt>
          <dd id="time">--</dd>
        </div>
        <div>
          <dt>Tiến độ</dt>
          <dd id="progress">--</dd>
        </div>
        <div>
          <dt>Tốc độ</dt>
          <dd id="speed">--</dd>
        </div>
        <div>
          <dt>Âm lượng</dt>
          <dd id="volume">--</dd>
        </div>
      </dl>
      <button id="start" type="button">Bắt đầu học</button>
      <button id="stop" type="button" class="secondary">Dừng</button>
      <button id="refresh" type="button">Kiểm tra lại</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
